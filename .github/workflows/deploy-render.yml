name: Deploy to Render

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - ".github/workflows/ci.yml"

env:
  RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get service config and latest deploy status
        run: |
          set -e
          # Read service details
          curl -sS -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Accept: application/json" \
            "https://api.render.com/v1/services?limit=100" | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          for i in d:
              s=i.get('service',i)
              if s['name']!='leadgraph-api': continue
              sid=s['id']
              print(f'Service ID: {sid}')
              print(f'Service name: {s.get(\"name\",\"?\")}')
              print(f'Service type: {s.get(\"type\",\"?\")}')
              print(f'Service runtime: {s.get(\"runtime\",\"?\")}')
              print(f'Service repo: {s.get(\"repo\",\"?\")}')
              print(f'Service branch: {s.get(\"branch\",\"?\")}')
              print(f'Service autoDeploy: {s.get(\"autoDeploy\",\"?\")}')
              print(f'Service startCommand: {s.get(\"startCommand\",\"?\")}')
              print(f'Service buildCommand: {s.get(\"buildCommand\",\"?\")}')
              print(f'Service healthCheckPath: {s.get(\"healthCheckPath\",\"?\")}')
              print(f'Service envVars: {s.get(\"envVars\",\"?\")}')
              # Write service ID to file
              with open('svc_id.txt','w') as f: f.write(sid)
              break
          else:
              print('Service not found')
              exit(1)
          "

      - name: Trigger deploy
        run: |
          set -e
          SVC_ID=$(cat svc_id.txt)
          RESP=$(curl -sS -w "\n%{http_code}" -X POST \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{"clearCache":"clear"}' \
            "https://api.render.com/v1/services/$SVC_ID/deploys")
          HTTP_CODE=$(echo "$RESP" | tail -1)
          BODY=$(echo "$RESP" | sed '$d')
          echo "HTTP status: $HTTP_CODE"
          echo "Response: $BODY"
          if [ "$HTTP_CODE" != "201" ] && [ "$HTTP_CODE" != "202" ] && [ "$HTTP_CODE" != "200" ]; then
            echo "ERROR: deploy API returned $HTTP_CODE"
            exit 22
          fi
          echo "Deploy triggered"

      - name: Wait for live (up to 5 min)
        run: |
          SVC_ID=$(cat svc_id.txt)
          for i in $(seq 1 10); do
            echo "  check $i/10..."
            sleep 30
            INFO=$(curl -sS -H "Authorization: Bearer $RENDER_API_KEY" \
              "https://api.render.com/v1/services/$SVC_ID/deploys?limit=1")
            DID=$(echo "$INFO" | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          if not d: print(''); exit(0)
          dep=d[0].get('deploy',d[0])
          print(dep.get('id',''))
          ")
            STATUS=$(echo "$INFO" | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          if not d: print('no_deploys'); exit(0)
          dep=d[0].get('deploy',d[0])
          print(dep.get('status','?'))
          ")
            echo "  deploy $DID: $STATUS"
            case "$STATUS" in
              live) echo "LIVE!"; exit 0 ;;
              build_failed|update_failed|deactivated)
                echo "FAILED: $STATUS"
                echo "$INFO" | python3 -c "import json,sys; d=json.load(sys.stdin); print(json.dumps(d[0].get('deploy',d[0]),indent=2))"
                # Try various log endpoints
                for ep in "/v1/services/$SVC_ID/deploys/$DID/logs" "/v1/deploys/$DID/logs"; do
                  echo "=== Logs from $ep ==="
                  curl -sS -H "Authorization: Bearer $RENDER_API_KEY" "https://api.render.com$ep" 2>/dev/null | head -100
                done
                exit 1 ;;
            esac
          done
          echo "timeout"; exit 1

  verify-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Check bot status via API debug endpoint
        run: |
          sleep 30
          DEBUG=$(curl -sS -f --max-time 30 "https://leadgraph-api.onrender.com/debug" || echo '{"bot_running":false}')
          if echo "$DEBUG" | python3 -c "import sys,json; d=json.load(sys.stdin); sys.exit(0 if d.get('bot_running') else 1)"; then
            echo "Bot is running!"
          else
            echo "Bot is NOT running!"
            exit 1
          fi
