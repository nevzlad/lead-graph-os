name: Deploy to Render

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - ".github/workflows/ci.yml"

env:
  RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trigger deploy and wait for live
        id: deploy
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          ONBOARDING_BOT_TOKEN: ${{ secrets.ONBOARDING_BOT_TOKEN }}
          HF_API_KEY: ${{ secrets.HF_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -e
          # 1. Find service ID
          SVC_ID=$(curl -sS -H "Authorization: Bearer ${RENDER_API_KEY}" \
            "https://api.render.com/v1/services?limit=100" | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          for i in d:
              s=i.get('service',i)
              if s['name']=='leadgraph-api':
                  print(s['id']);break
          ")
          [ -n "$SVC_ID" ] || { echo "Service not found"; exit 1; }
          echo "SVC: $SVC_ID"

          # 2. Update env vars
          echo "$TG_BOT_TOKEN$HF_API_KEY$ONBOARDING_BOT_TOKEN$DATABASE_URL" >/dev/null
          curl -sS -H "Authorization: Bearer $RENDER_API_KEY" \
            "https://api.render.com/v1/services/$SVC_ID/env-vars" | python3 -c "
          import json,os,urllib.request
          sid='$SVC_ID'; tok=os.environ['RENDER_API_KEY']
          env={}
          for e in json.load(sys.stdin):
              ev=e.get('envVar',e)
              k=ev.get('key','')
              if not k or 'generateValue' in str(e): continue
              v=e.get('value',ev.get('value',''))
              if v: env[k]=v
          for k in ('HF_API_KEY','TG_BOT_TOKEN','ONBOARDING_BOT_TOKEN'):
              v=os.environ.get(k,'')
              if v: env[k]=v
          db=os.environ.get('DATABASE_URL','')
          if db: env['DATABASE_URL']=db
          if env:
              body=json.dumps([{'key':k,'value':v} for k,v in env.items()]).encode()
              urllib.request.urlopen(urllib.request.Request(
                  f'https://api.render.com/v1/services/{sid}/env-vars',
                  data=body,method='PUT',
                  headers={'Authorization':f'Bearer {tok}','Content-Type':'application/json'}))
              print(f'env: {len(env)} vars')
          "
          echo "env done"

          # 3. Trigger deploy
          curl -sfS -X POST -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{"clearCache":"clear"}' \
            "https://api.render.com/v1/services/$SVC_ID/deploys" > /dev/null
          echo "deploy triggered"

          # 4. Poll for live status
          for i in $(seq 1 10); do
            echo "  check $i/10..."
            sleep 30
            STATUS=$(curl -sS -H "Authorization: Bearer $RENDER_API_KEY" \
              "https://api.render.com/v1/services/$SVC_ID/deploys?limit=1" | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          if not d: print('no_deploys'); exit(0)
          dep=d[0].get('deploy',d[0])
          s=dep.get('status','?')
          print(s)
          ")
            echo "  status: $STATUS"
            case "$STATUS" in
              live) echo "LIVE!"; exit 0 ;;
              build_failed|update_failed|deactivated)
                echo "FAILED: $STATUS"
                curl -sS -H "Authorization: Bearer $RENDER_API_KEY" \
                  "https://api.render.com/v1/services/$SVC_ID/deploys?limit=1"
                exit 1 ;;
            esac
          done
          echo "timeout"; exit 1

  verify-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Check bot status via API debug endpoint
        run: |
          sleep 30
          DEBUG=$(curl -sS -f --max-time 30 "https://leadgraph-api.onrender.com/debug" || echo '{"bot_running":false}')
          if echo "$DEBUG" | python3 -c "import sys,json; d=json.load(sys.stdin); sys.exit(0 if d.get('bot_running') else 1)"; then
            echo "Bot is running!"
          else
            echo "Bot is NOT running!"
            exit 1
          fi
