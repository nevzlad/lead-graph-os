name: Deploy to Render

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - ".github/workflows/ci.yml"

env:
  RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Just trigger deploy and wait for live (no env var updates)
        run: |
          set -e
          SVC_ID=$(curl -sS -H "Authorization: Bearer ${RENDER_API_KEY}" \
            "https://api.render.com/v1/services?limit=100" | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          for i in d:
              s=i.get('service',i)
              if s['name']=='leadgraph-api':
                  print(s['id']);break
          ")
          [ -n "$SVC_ID" ] || { echo "Service not found"; exit 1; }
          echo "SVC: $SVC_ID"

          # Just trigger deploy — env vars already set on service
          curl -sfS -X POST -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{"clearCache":"clear"}' \
            "https://api.render.com/v1/services/$SVC_ID/deploys" > /dev/null
          echo "deploy triggered"

          # Poll for live status
          for i in $(seq 1 10); do
            echo "  check $i/10..."
            sleep 30
            INFO=$(curl -sS -H "Authorization: Bearer $RENDER_API_KEY" \
              "https://api.render.com/v1/services/$SVC_ID/deploys?limit=1")
            DID=$(echo "$INFO" | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          if not d: print(''); exit(0)
          dep=d[0].get('deploy',d[0])
          print(dep.get('id',''))
          ")
            STATUS=$(echo "$INFO" | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          if not d: print('no_deploys'); exit(0)
          dep=d[0].get('deploy',d[0])
          print(dep.get('status','?'))
          ")
            echo "  deploy $DID: $STATUS"
            case "$STATUS" in
              live) echo "LIVE!"; exit 0 ;;
              build_failed|update_failed|deactivated)
                echo "FAILED: $STATUS"
                echo "=== deploy info ==="
                echo "$INFO" | python3 -c "import json,sys; d=json.load(sys.stdin); print(json.dumps(d[0].get('deploy',d[0]),indent=2))" 2>/dev/null || echo "$INFO"
                exit 1 ;;
            esac
          done
          echo "timeout"; exit 1

  verify-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Check bot status via API debug endpoint
        run: |
          sleep 30
          DEBUG=$(curl -sS -f --max-time 30 "https://leadgraph-api.onrender.com/debug" || echo '{"bot_running":false}')
          if echo "$DEBUG" | python3 -c "import sys,json; d=json.load(sys.stdin); sys.exit(0 if d.get('bot_running') else 1)"; then
            echo "Bot is running!"
          else
            echo "Bot is NOT running!"
            exit 1
          fi
