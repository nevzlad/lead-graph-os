name: Deploy to Render

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - ".github/workflows/ci.yml"

env:
  RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check env vars set
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          ONBOARDING_BOT_TOKEN: ${{ secrets.ONBOARDING_BOT_TOKEN }}
          HF_API_KEY: ${{ secrets.HF_API_KEY }}
        run: |
          if [ -z "$RENDER_API_KEY" ]; then
            echo "Skipping: RENDER_API_KEY not set in GitHub secrets"
            exit 0
          fi
          missing=""
          [ -z "$TG_BOT_TOKEN" ] && missing="$missing TG_BOT_TOKEN"
          [ -z "$ONBOARDING_BOT_TOKEN" ] && missing="$missing ONBOARDING_BOT_TOKEN"
          [ -z "$HF_API_KEY" ] && missing="$missing HF_API_KEY"
          if [ -n "$missing" ]; then
            echo "Warning: missing secrets:$missing — will skip env var update if not already set on Render"
          fi

      - name: Set env vars on Render services
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          ONBOARDING_BOT_TOKEN: ${{ secrets.ONBOARDING_BOT_TOKEN }}
          HF_API_KEY: ${{ secrets.HF_API_KEY }}
        run: |
          set -e
          SERVICES=$(curl -sS -H "Authorization: Bearer ${RENDER_API_KEY}" \
            "https://api.render.com/v1/services?limit=100")
          echo "$SERVICES" | python3 -c "
import json, sys, os, urllib.request

data = json.load(sys.stdin)
token = os.environ['RENDER_API_KEY']
names = ('leadgraph-api', 'leadgraph-worker', 'leadgraph-bot')

for item in data:
    svc = item.get('service') or item
    name = svc.get('name', '')
    if name not in names:
        continue
    sid = svc['id']

    # Get current env vars (to preserve generated ones like DATABASE_URL)
    cur_req = urllib.request.Request(
        f'https://api.render.com/v1/services/{sid}/env-vars',
        headers={'Authorization': f'Bearer {token}'},
    )
    cur = json.loads(urllib.request.urlopen(cur_req).read())
    env_map = {}
    for ev in cur:
        k = ev.get('key') or ev.get('envVar', {}).get('key', '')
        v = ev.get('value') or ev.get('envVar', {}).get('value', '')
        if k:
            env_map[k] = v

    # Update with our secrets
    for env_key in ('HF_API_KEY', 'TG_BOT_TOKEN', 'ONBOARDING_BOT_TOKEN'):
        val = os.environ.get(env_key, '')
        if val:
            env_map[env_key] = val

    # Build payload: array of {key, value}
    env_payload = [{'key': k, 'value': v} for k, v in env_map.items()]
    body = json.dumps(env_payload).encode()
    req = urllib.request.Request(
        f'https://api.render.com/v1/services/{sid}/env-vars',
        data=body,
        method='PUT',
        headers={
            'Authorization': f'Bearer {token}',
            'Content-Type': 'application/json',
        },
    )
    urllib.request.urlopen(req)
    print(f'Env vars updated: {name} ({sid}) — {len(env_map)} vars')
"

      - name: Trigger deploy for all Lead-Graph services
        run: |
          if [ -z "$RENDER_API_KEY" ]; then
            echo "Skipping: RENDER_API_KEY not set in GitHub secrets"
            exit 0
          fi
          set -e
          SERVICES=$(curl -sS -H "Authorization: Bearer ${RENDER_API_KEY}" \
            "https://api.render.com/v1/services?limit=100")
          echo "$SERVICES" | python3 -c "
          import json, sys, os, urllib.request
          data = json.load(sys.stdin)
          token = os.environ['RENDER_API_KEY']
          names = ('leadgraph-api', 'leadgraph-worker', 'leadgraph-bot')
          for item in data:
              svc = item.get('service') or item
              name = svc.get('name', '')
              if name in names:
                  sid = svc['id']
                  req = urllib.request.Request(
                      f'https://api.render.com/v1/services/{sid}/deploys',
                      method='POST',
                      headers={'Authorization': f'Bearer {token}', 'Content-Type': 'application/json'},
                      data=b'{}',
                  )
                  urllib.request.urlopen(req)
                  print(f'Deploy triggered: {name} ({sid})')
          "

  deploy-hooks:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy API via hook
        env:
          URL: ${{ secrets.RENDER_DEPLOY_HOOK_API }}
        run: |
          if [ -z "$URL" ]; then
            echo "Skipping: RENDER_DEPLOY_HOOK_API not set"
            exit 0
          fi
          curl -fsS -X POST "$URL"
      - name: Deploy worker via hook
        env:
          URL: ${{ secrets.RENDER_DEPLOY_HOOK_WORKER }}
        run: |
          if [ -z "$URL" ]; then
            echo "Skipping: RENDER_DEPLOY_HOOK_WORKER not set"
            exit 0
          fi
          curl -fsS -X POST "$URL"
      - name: Deploy bot via hook
        env:
          URL: ${{ secrets.RENDER_DEPLOY_HOOK_BOT }}
        run: |
          if [ -z "$URL" ]; then
            echo "Skipping: RENDER_DEPLOY_HOOK_BOT not set"
            exit 0
          fi
          curl -fsS -X POST "$URL"
