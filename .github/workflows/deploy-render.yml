name: Deploy to Render

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - ".github/workflows/ci.yml"

env:
  RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Set env vars and deploy all services
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          ONBOARDING_BOT_TOKEN: ${{ secrets.ONBOARDING_BOT_TOKEN }}
          HF_API_KEY: ${{ secrets.HF_API_KEY }}
        run: |
          if [ -z "$RENDER_API_KEY" ]; then
            echo "Skipping: RENDER_API_KEY not set"
            exit 0
          fi
          set -e
          SERVICES=$(curl -sS -H "Authorization: Bearer ${RENDER_API_KEY}" \
            "https://api.render.com/v1/services?limit=100")
          echo "$SERVICES" | python3 -c "
          import json, sys, os, urllib.request
          data = json.load(sys.stdin)
          token = os.environ['RENDER_API_KEY']
          names = ('leadgraph-api', 'leadgraph-worker', 'leadgraph-bot')
          all_names = []
          for item in data:
              svc = item.get('service') or item
              all_names.append(svc.get('name', ''))
          print(f'Services found: {all_names}')
          for item in data:
              svc = item.get('service') or item
              name = svc.get('name', '')
              if name not in names:
                  continue
              sid = svc['id']
              print(f'Processing: {name} ({sid})')
              cur_req = urllib.request.Request(
                  f'https://api.render.com/v1/services/{sid}/env-vars',
                  headers={'Authorization': f'Bearer {token}'},
              )
              cur = json.loads(urllib.request.urlopen(cur_req).read())
              env_map = {}
              for ev in cur:
                  env_var = ev.get('envVar') or ev
                  key = env_var.get('key', '')
                  if not key:
                      continue
                  if 'generateValue' in ev or 'generateValue' in env_var:
                      continue
                  if key in ('DATABASE_URL', 'REDIS_URL'):
                      continue
                  val = ev.get('value') or env_var.get('value', '')
                  if val:
                      env_map[key] = val
              for env_key in ('HF_API_KEY', 'TG_BOT_TOKEN', 'ONBOARDING_BOT_TOKEN'):
                  val = os.environ.get(env_key, '')
                  if val:
                      env_map[env_key] = val
              if env_map:
                  env_payload = [{'key': k, 'value': v} for k, v in env_map.items()]
                  body = json.dumps(env_payload).encode()
                  req = urllib.request.Request(
                      f'https://api.render.com/v1/services/{sid}/env-vars',
                      data=body,
                      method='PUT',
                      headers={
                          'Authorization': f'Bearer {token}',
                          'Content-Type': 'application/json',
                      },
                  )
                  urllib.request.urlopen(req)
                  print(f'Env vars set: {name} ({sid}) - {len(env_map)} vars: {list(env_map.keys())}')
              else:
                  print(f'No env vars to set for {name}')
              deploy_req = urllib.request.Request(
                  f'https://api.render.com/v1/services/{sid}/deploys',
                  method='POST',
                  headers={'Authorization': f'Bearer {token}', 'Content-Type': 'application/json'},
                  data=b'{}',
              )
              deploy_resp_raw = urllib.request.urlopen(deploy_req).read().decode()
              if deploy_resp_raw:
                  deploy_resp = json.loads(deploy_resp_raw)
                  deploy_id = deploy_resp.get('id') or deploy_resp.get('deploy', {}).get('id', 'unknown')
                  print(f'Deploy triggered: {name} ({sid}) - deploy ID: {deploy_id}')
              else:
                  print(f'Deploy triggered: {name} ({sid}) - no response body')
          "
      - name: Wait for deploys and check status
        run: |
          echo "Waiting 120s for deploys..."
          sleep 120
          SERVICES=$(curl -sS -H "Authorization: Bearer ${RENDER_API_KEY}" \
            "https://api.render.com/v1/services?limit=100")
          echo "$SERVICES" | python3 -c "
          import json, sys, os, urllib.request
          data = json.load(sys.stdin)
          token = os.environ['RENDER_API_KEY']
          names = ('leadgraph-api', 'leadgraph-worker', 'leadgraph-bot')
          all_names = []
          for item in data:
              svc = item.get('service') or item
              all_names.append(svc.get('name', ''))
          print(f'Wait: services found: {all_names}')
          for item in data:
              svc = item.get('service') or item
              name = svc.get('name', '')
              if name not in names:
                  continue
              sid = svc['id']
              deploys_req = urllib.request.Request(
                  f'https://api.render.com/v1/services/{sid}/deploys?limit=1',
                  headers={'Authorization': f'Bearer {token}'},
              )
              deploys = json.loads(urllib.request.urlopen(deploys_req).read())
              if isinstance(deploys, list) and len(deploys) > 0:
                  dep = deploys[0].get('deploy', deploys[0])
                  dep_id = dep.get('id', '?')
                  status = dep.get('status', '?')
                  finished_at = dep.get('finishedAt', '')
                  print(f'{name}: deploy {dep_id} - {status} (finished: {finished_at})')
              else:
                  print(f'{name}: no deploys')
          "

  deploy-hooks:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy API via hook
        env:
          URL: ${{ secrets.RENDER_DEPLOY_HOOK_API }}
        run: |
          if [ -z "$URL" ]; then
            echo "Skipping: RENDER_DEPLOY_HOOK_API not set"
            exit 0
          fi
          curl -fsS -X POST "$URL"
      - name: Deploy worker via hook
        env:
          URL: ${{ secrets.RENDER_DEPLOY_HOOK_WORKER }}
        run: |
          if [ -z "$URL" ]; then
            echo "Skipping: RENDER_DEPLOY_HOOK_WORKER not set"
            exit 0
          fi
          curl -fsS -X POST "$URL"
      - name: Deploy bot via hook
        env:
          URL: ${{ secrets.RENDER_DEPLOY_HOOK_BOT }}
        run: |
          if [ -z "$URL" ]; then
            echo "Skipping: RENDER_DEPLOY_HOOK_BOT not set"
            exit 0
          fi
          curl -fsS -X POST "$URL"
