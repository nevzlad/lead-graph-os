name: Deploy to Render

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - ".github/workflows/ci.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger deploy for all Lead-Graph services
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          if [ -z "$RENDER_API_KEY" ]; then
            echo "Skipping: RENDER_API_KEY not set in GitHub secrets"
            exit 0
          fi
          set -e
          SERVICES=$(curl -sS -H "Authorization: Bearer ${RENDER_API_KEY}" \
            "https://api.render.com/v1/services?limit=100")
          echo "$SERVICES" | python3 -c "
          import json, sys, os, urllib.request
          data = json.load(sys.stdin)
          token = os.environ['RENDER_API_KEY']
          names = ('leadgraph-api', 'leadgraph-worker', 'leadgraph-bot')
          for item in data:
              svc = item.get('service') or item
              name = svc.get('name', '')
              if name in names:
                  sid = svc['id']
                  req = urllib.request.Request(
                      f'https://api.render.com/v1/services/{sid}/deploys',
                      method='POST',
                      headers={'Authorization': f'Bearer {token}', 'Content-Type': 'application/json'},
                      data=b'{}',
                  )
                  urllib.request.urlopen(req)
                  print(f'Deploy triggered: {name} ({sid})')
          "

  deploy-hooks:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy API via hook
        env:
          URL: ${{ secrets.RENDER_DEPLOY_HOOK_API }}
        run: |
          if [ -z "$URL" ]; then
            echo "Skipping: RENDER_DEPLOY_HOOK_API not set"
            exit 0
          fi
          curl -fsS -X POST "$URL"
      - name: Deploy worker via hook
        env:
          URL: ${{ secrets.RENDER_DEPLOY_HOOK_WORKER }}
        run: |
          if [ -z "$URL" ]; then
            echo "Skipping: RENDER_DEPLOY_HOOK_WORKER not set"
            exit 0
          fi
          curl -fsS -X POST "$URL"
      - name: Deploy bot via hook
        env:
          URL: ${{ secrets.RENDER_DEPLOY_HOOK_BOT }}
        run: |
          if [ -z "$URL" ]; then
            echo "Skipping: RENDER_DEPLOY_HOOK_BOT not set"
            exit 0
          fi
          curl -fsS -X POST "$URL"
