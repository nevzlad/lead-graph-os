services:
  - type: web
    name: leadgraph-api
    runtime: docker
    plan: free
    repo: https://github.com/nevzlad/lead-graph-os
    branch: main
    dockerfilePath: ./Dockerfile
    dockerCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: MODE
        value: commercial
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: HF_API_KEY
        sync: false
      - key: TG_BOT_TOKEN
        sync: false
      - key: CEREBRAS_API_KEY
        sync: false
      - key: ONBOARDING_BOT_TOKEN
        sync: false
